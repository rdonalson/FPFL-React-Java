services:
  ui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_NODE_ENV: uat
        VITE_API_URL: http://localhost:9100
        VITE_API_TIMEOUT_MS: 30000
        VITE_SESSION_WARNING_MS: 60000
        VITE_SESSION_DEBUG: 'false'
    image: fpfluitsximg
    container_name: fpfl-ui-tsx
    ports:
      - '9000:80' # UI-TSX -> http://localhost:9000
    env_file:
      - .env.uat
