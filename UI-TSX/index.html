<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%VITE_APP_TITLE%</title>
    <meta name="description" content="%VITE_APP_DESCRIPTION%" />

    <!-- Open Graph / social previews -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%VITE_APP_TITLE%" />
    <meta property="og:description" content="%VITE_APP_DESCRIPTION%" />
    <meta property="og:image" content="%VITE_APP_OG_IMAGE%" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link id="theme-css" rel="stylesheet" href="/themes/lara-light-indigo/theme.css" />

    <!--
      Runtime config overrides, merged over build-time .env values by initAppConfig().
      Keep empty in source so .env.development / .env.production apply.
      In production, the server may replace this object with per-environment values.
      Must appear before the app bundle.
    -->
    <script>
      window.__RUNTIME_CONFIG__ = {
        session: { warningBeforeMs: 300000, debug: false },
        features: { enableBetaX: true },
        api: { timeoutMs: 15000 },
      };
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- App bundle -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
