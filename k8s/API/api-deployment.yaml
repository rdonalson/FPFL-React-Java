apiVersion: apps/v1
kind: Deployment
metadata:
    name: api
    namespace: fpfl
spec:
    replicas: 1
    selector:
        matchLabels:
            app: fpfl-api
    template:
        metadata:
            labels:
                app: fpfl-api
        spec:
            containers:
                - name: api
                  image: fpflacr.azurecr.io/fpflapijdkimg:latest
                  ports:
                      - containerPort: 8080
                  env:
                      - name: SERVER_PORT
                        value: "8080"
                      - name: SPRING_DATASOURCE_URL
                        valueFrom:
                            secretKeyRef:
                                name: api-db-secret
                                key: DB_URL
                      - name: SPRING_DATASOURCE_USERNAME
                        valueFrom:
                            secretKeyRef:
                                name: api-db-secret
                                key: DB_USERNAME
                      - name: SPRING_DATASOURCE_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: api-db-secret
                                key: DB_PASSWORD
                      # Signing key for access tokens (Base64, 256+ bits). Create it once with:
                      #   kubectl create secret generic api-jwt-secret -n fpfl --from-literal=JWT_SECRET="$(openssl rand -base64 48)"
                      - name: JWT_SECRET
                        valueFrom:
                            secretKeyRef:
                                name: api-jwt-secret
                                key: JWT_SECRET
                      - name: SPRING_JPA_HIBERNATE_DDL_AUTO
                        value: "update"
                      - name: SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA
                        value: "fpfl"
                  resources:
                      requests:
                          memory: "384Mi"
                          cpu: "250m"
                      limits:
                          memory: "768Mi"
                          cpu: "500m"
