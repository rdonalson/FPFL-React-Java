name: Build and Push FPFL UI-TSX to ACR

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'UI-TSX/**'
      - 'k8s/UI/ui-deployment.yaml'
      - 'k8s/UI/ui-service.yaml'
      - 'k8s/UI/ui-ingress.yaml'

env:
  REGISTRY: fpflacr.azurecr.io
  IMAGE_NAME: fpfluitsximg

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./UI-TSX
          file: ./UI-TSX/Dockerfile
          push: true
          build-args: |
            VITE_NODE_ENV=production
            VITE_API_URL=https://api-jdk.ledger-finance.com
            VITE_API_TIMEOUT_MS=30000
            VITE_SESSION_WARNING_MS=60000
            VITE_SESSION_DEBUG=false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: FPFL-React-Java
          cluster-name: fpfl-cluster

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/UI/ui-service.yaml
          kubectl apply -f k8s/UI/ui-deployment.yaml
          kubectl apply -f k8s/UI/ui-ingress.yaml

      - name: Force rollout to pull new image
        run: |
          kubectl rollout restart deployment/ui -n fpfl
          kubectl rollout status deployment/ui -n fpfl --timeout=120s
