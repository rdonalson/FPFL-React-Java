name: Build and Push API to ACR

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'API-JDK/**'
      - 'k8s/API/api-deployment.yaml'
      - 'k8s/API/api-service.yaml'
      - 'k8s/API/api-ingress.yaml'

env:
  REGISTRY: fpflacr.azurecr.io
  IMAGE_NAME: fpflapijdkimg

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./API-JDK
          file: ./API-JDK/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: FPFL-React-Java
          cluster-name: fpfl-cluster

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/API/api-service.yaml
          kubectl apply -f k8s/API/api-deployment.yaml
          kubectl apply -f k8s/API/api-ingress.yaml

      - name: Force rollout to pull new image
        run: |
          kubectl rollout restart deployment/api -n fpfl
          kubectl rollout status deployment/api -n fpfl --timeout=120s
