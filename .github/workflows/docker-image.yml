name: Deploy API to AKS

on:
  push:
    branches: [ "main" ]
    paths:
      - "module-api/**"
      - "module-auth/**"
      - "module-common-bc/**"
      - "module-display-bc/**"
      - "module-items-bc/**"
      - "pom.xml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API JAR
        run: mvn -B -DskipTests -pl module-api -am package

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Login to ACR
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.AZURE_ACR_NAME }}.azurecr.io
          username: ${{ secrets.AZURE_CLIENT_ID }}
          password: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/fpfl-api:latest .
          docker push ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/fpfl-api:latest

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.AZURE_AKS_NAME }} \
            --overwrite-existing

      - name: Deploy to AKS
        run: |
          kubectl set image deployment/fpfl-api fpfl-api=${{ secrets.AZURE_ACR_NAME }}.azurecr.io/fpfl-api:latest
