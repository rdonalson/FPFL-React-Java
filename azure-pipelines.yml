# Docker
# Build and push an image to Azure Container Registry
# Deploy API to Azure Web App (Docker Container)

trigger:
- main

resources:
- repo: self

variables:
  dockerRegistryServiceConnection: 'caf955c7-ff86-42e4-9969-096bd1d5978d'
  imageRepository: 'fpflapijdkv2'
  containerRegistry: 'fpflregistry.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/API-JDK/Dockerfile'
  tag: '$(Build.BuildId)'
  vmImageName: 'ubuntu-latest'

stages:

# ---------------------------------------------------------
# BUILD STAGE
# ---------------------------------------------------------
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)

# ---------------------------------------------------------
# DEPLOY STAGE (WEB APP)
# ---------------------------------------------------------
- stage: Deploy
  displayName: Deploy API to Azure Web App
  dependsOn: Build
  jobs:
  - job: Deploy
    displayName: Deploy API Container
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: AzureCLI@2
      displayName: Deploy container to existing Web App
      inputs:
        azureSubscription: 'Azure Resource Manager'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "Deploying container image to Web App..."

          az webapp config container set \
            --name fpfl-api-jdk-wa \
            --resource-group rg-fpfl-v2 \
            --container-image-name $(containerRegistry)/$(imageRepository):$(tag)

          echo "Deployment complete."
