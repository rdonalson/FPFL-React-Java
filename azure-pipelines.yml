# Docker
# Build and push an image to Azure Container Registry
# Deploy API to AKS cluster

trigger:
- main

resources:
- repo: self

variables:
  # Container registry service connection established during pipeline creation
  dockerRegistryServiceConnection: 'caf955c7-ff86-42e4-9969-096bd1d5978d'
  imageRepository: 'fpflapijdkv2'
  containerRegistry: 'fpflregistry.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/API-JDK/Dockerfile'
  tag: '$(Build.BuildId)'

  # Agent VM image name
  vmImageName: 'ubuntu-latest'

stages:

# ---------------------------------------------------------
# BUILD STAGE
# ---------------------------------------------------------
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)

# ---------------------------------------------------------
# DEPLOY STAGE
# ---------------------------------------------------------
- stage: Deploy
  displayName: Deploy API to AKS
  dependsOn: Build
  jobs:
  - job: Deploy
    displayName: Deploy API to AKS
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: AzureCLI@2
      displayName: Update fpfl-api deployment in AKS
      inputs:
        azureSubscription: 'Azure Resource Manager'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "Connecting to AKS cluster..."
          az aks get-credentials --resource-group rg-fpfl-v2 --name aks-fpfl-v2-cluster

          echo "Updating fpfl-api deployment with new image tag..."
          kubectl set image deployment/fpfl-api fpfl-api=$(containerRegistry)/$(imageRepository):$(tag)

          echo "Applying API service (internal only)..."
          kubectl apply -f k8s/fpfl-api-service.yaml

          echo "Deployment complete."
