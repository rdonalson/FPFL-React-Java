# Docker
# Build and push an image to Azure Container Registry
# Deploy API to Azure Web App (Docker Container)

trigger:
- main

resources:
- repo: self

variables:
  dockerRegistryServiceConnection: 'caf955c7-ff86-42e4-9969-096bd1d5978d'
  imageRepository: 'fpflapijdkv2'
  containerRegistry: 'fpflregistry.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/API-JDK/Dockerfile'
  tag: '$(Build.BuildId)'
  vmImageName: 'ubuntu-latest'

stages:

# ---------------------------------------------------------
# BUILD STAGE
# ---------------------------------------------------------
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)

# ---------------------------------------------------------
# DEPLOY STAGE (WEB APP)
# ---------------------------------------------------------
- stage: Deploy
  displayName: Deploy API to Azure Web App
  dependsOn: Build
  jobs:
  - job: Deploy
    displayName: Deploy API Container
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: AzureCLI@2
      displayName: Create Web App (if not exists) and deploy container
      inputs:
        azureSubscription: 'Azure Resource Manager'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "Logging into Azure..."
          az account show

          echo "Creating App Service Plan (if not exists)..."
          az appservice plan create \
            --name fpfl-app-plan \
            --resource-group rg-fpfl-v2 \
            --sku B1 \
            --is-linux

          echo "Creating Web App (if not exists)..."
          az webapp create \
            --resource-group rg-fpfl-v2 \
            --plan fpfl-app-plan \
            --name fpfl-api-jdk-wa \
            --deployment-container-image-name $(containerRegistry)/$(imageRepository):$(tag)

          echo "Updating Web App container image..."
          az webapp config container set \
            --name fpfl-api-jdk-wa \
            --resource-group rg-fpfl-v2 \
            --docker-custom-image-name $(containerRegistry)/$(imageRepository):$(tag)

          echo "Deployment complete."
