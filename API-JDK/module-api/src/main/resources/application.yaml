management:
    endpoints:
        web:
            exposure:
                include: health,info
    endpoint:
        health:
            show-details: always
            show-components: always
    info:
        build:
            enabled: true
        env:
            enabled: true

security:
    jwt:
        # Base64, at least 256 bits. Set JWT_SECRET in every deployed environment
        # (e.g. openssl rand -base64 48); the default below is for local development only.
        secret: ${JWT_SECRET:ZnBmbC1sb2NhbC1kZXYtb25seS1qd3Qtc2VjcmV0LW5vdC1mb3ItcHJvZHVjdGlvbiEh}
        # 15 seconds
        #access-token-expiration-ms: 30000
        #refresh-token-expiration-ms: 30000

        # 1 minute
        #access-token-expiration-ms: 60000
        #refresh-token-expiration-ms: 60000

        # 15 minutes
        access-token-expiration-ms: 900000
        refresh-token-expiration-ms: 900000

        # 7 days
        #refresh-token-expiration-ms: 604800000


