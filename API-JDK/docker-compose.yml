services:
    api:
        build:
            context: .
            dockerfile: Dockerfile
        image: fpflapijdkimg
        container_name: fpfl-api-jdk
        environment:
            SPRING_DATASOURCE_URL: ${DB_URL}
            SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
            SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
            SPRING_JPA_HIBERNATE_DDL_AUTO: update
            SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: fpfl

            # Must match your Dockerfile + Kubernetes containerPort
            SERVER_PORT: 8080
        ports:
            - "8080:8080"
