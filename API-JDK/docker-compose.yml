# Run the API on its own:  docker compose up --build   (from API-JDK)
#   API -> http://localhost:9100  (Swagger at /swagger-ui.html, health at /actuator/health)
#
# Database settings come from .env.docker (local PostgreSQL on the host via host.docker.internal).
# application.yaml reads DB_URL / DB_USERNAME / DB_PASSWORD directly, so they are NOT re-mapped
# under `environment:` — a ${DB_URL} there is filled from API-JDK/.env (localhost:5432), which
# inside the container points at the container itself and stops the app at startup.
# To run against the Azure database instead, switch env_file to .env.prod.
services:
    api:
        build:
            context: .
            dockerfile: Dockerfile
        image: fpflapijdkimg
        container_name: fpfl-api-jdk
        env_file:
            - .env.docker
        environment:
            SPRING_JPA_HIBERNATE_DDL_AUTO: update
            SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: fpfl

            # Must match your Dockerfile + Kubernetes containerPort
            SERVER_PORT: 8080
        ports:
            - "9100:8080" # API-JDK -> http://localhost:9100
        extra_hosts:
            - "host.docker.internal:host-gateway"
        restart: unless-stopped
